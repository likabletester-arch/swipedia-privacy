<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hesap Silme Talebi | Swipedia</title>

  <meta
    id="metaDescription"
    name="description"
    content="Swipedia hesabınızın ve hesabınızla ilişkili verilerin silinmesini talep edin."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0b0a;
      --card: #171311;
      --card-light: #211a17;
      --border: #332722;
      --text: #f7f3f1;
      --muted: #aaa19c;
      --accent: #ff765f;
      --accent-hover: #ff8b76;
      --warning-bg: rgba(255, 118, 95, 0.08);
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(255, 118, 95, 0.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      line-height: 1.7;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 42px 0 20px;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      color: var(--text);
      text-decoration: none;

      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #ff8a70,
          #ff6049
        );

      color: white;

      font-weight: 900;
      font-size: 20px;

      box-shadow:
        0 8px 30px rgba(255, 118, 95, 0.22);
    }

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 4px;

      padding: 4px;

      border-radius: 11px;

      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .lang-button {
      border: 0;
      background: transparent;

      color: var(--muted);

      padding: 7px 10px;

      border-radius: 8px;

      cursor: pointer;

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      transition: 0.2s ease;
    }

    .lang-button:hover {
      color: white;
    }

    .lang-button.active {
      color: white;
      background: var(--accent);
    }

    main {
      padding: 35px 0 80px;
    }

    .hero {
      margin-bottom: 35px;
    }

    .badge {
      display: inline-block;

      padding: 7px 12px;
      margin-bottom: 18px;

      border:
        1px solid rgba(255, 118, 95, 0.25);

      border-radius: 999px;

      background:
        rgba(255, 118, 95, 0.08);

      color: var(--accent);

      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      max-width: 700px;

      font-size: clamp(36px, 6vw, 58px);
      line-height: 1.08;

      letter-spacing: -2px;

      margin-bottom: 18px;
    }

    .hero p {
      max-width: 720px;

      color: var(--muted);

      font-size: 18px;
    }

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.025),
          transparent
        ),
        var(--card);

      border: 1px solid var(--border);
      border-radius: 22px;

      padding: 30px;
      margin-top: 22px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.20);
    }

    h2 {
      font-size: 22px;

      margin-bottom: 14px;

      letter-spacing: -0.4px;
    }

    p {
      color: var(--muted);
    }

    ol {
      padding-left: 24px;
      margin-top: 20px;
    }

    li {
      padding-left: 8px;
      margin-bottom: 17px;

      color: var(--muted);
    }

    li strong {
      color: var(--text);
    }

    .email {
      color: var(--accent);
      font-weight: 700;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 25px;

      padding: 15px 22px;

      border-radius: 13px;

      background: var(--accent);

      color: white;

      font-size: 15px;
      font-weight: 800;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .warning {
      margin-top: 25px;

      padding: 18px;

      border:
        1px solid rgba(255, 118, 95, 0.18);

      border-radius: 14px;

      background: var(--warning-bg);

      color: #d9ccc7;

      font-size: 14px;
    }

    .warning strong {
      color: var(--accent);
    }

    .data-list {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

      margin-top: 20px;
    }

    .data-item {
      padding: 15px;

      border-radius: 13px;

      background: var(--card-light);
      border: 1px solid var(--border);

      color: #c9bfba;

      font-size: 14px;
    }

    .data-item::before {
      content: "✓";

      color: var(--accent);

      font-weight: 900;

      margin-right: 8px;
    }

    footer {
      padding: 30px 0 45px;

      border-top:
        1px solid var(--border);

      color: #756d69;

      font-size: 13px;
    }

    .footer-content {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      flex-wrap: wrap;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 650px) {

      .container {
        width:
          min(100% - 28px, 900px);
      }

      header {
        padding-top: 25px;
      }

      .header-content {
        gap: 12px;
      }

      .brand {
        font-size: 19px;
      }

      .logo {
        width: 37px;
        height: 37px;
      }

      main {
        padding-top: 25px;
      }

      .card {
        padding: 22px;

        border-radius: 18px;
      }

      .data-list {
        grid-template-columns: 1fr;
      }

      h1 {
        letter-spacing: -1.3px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="container header-content">

      <a
        class="brand"
        href="https://likabletester-arch.github.io/swipedia-privacy/"
      >

        <div class="logo">
          S
        </div>

        Swipedia

      </a>


      <div class="language-switcher">

        <button
          class="lang-button"
          data-lang="tr"
          onclick="setLanguage('tr')"
        >
          TR
        </button>

        <button
          class="lang-button"
          data-lang="en"
          onclick="setLanguage('en')"
        >
          EN
        </button>

      </div>

    </div>

  </header>


  <main class="container">


    <section class="hero">

      <div
        class="badge"
        data-i18n="badge">
      </div>

      <h1 data-i18n="heroTitle"></h1>

      <p data-i18n="heroDescription"></p>

    </section>


    <section class="card">

      <h2 data-i18n="requestTitle"></h2>

      <p data-i18n="requestDescription"></p>


      <ol>

        <li data-i18n-html="step1"></li>

        <li data-i18n-html="step2"></li>

        <li data-i18n-html="step3"></li>

        <li data-i18n-html="step4"></li>

      </ol>


      <a
        id="deletionEmailButton"
        class="button"
        href="#"
        data-i18n="requestButton">
      </a>


      <div
        class="warning"
        data-i18n-html="warning">
      </div>

    </section>


    <section class="card">

      <h2 data-i18n="dataTitle"></h2>

      <p data-i18n="dataDescription"></p>


      <div class="data-list">

        <div
          class="data-item"
          data-i18n="data1">
        </div>

        <div
          class="data-item"
          data-i18n="data2">
        </div>

        <div
          class="data-item"
          data-i18n="data3">
        </div>

        <div
          class="data-item"
          data-i18n="data4">
        </div>

      </div>

    </section>


    <section class="card">

      <h2 data-i18n="contactTitle"></h2>

      <p data-i18n="contactDescription"></p>

      <p style="margin-top: 12px;">

        <span class="email">
          likabletester@gmail.com
        </span>

      </p>

      <p
        style="margin-top: 8px;"
        data-i18n="developer">
      </p>

    </section>

  </main>


  <footer>

    <div class="container footer-content">

      <span>
        © 2026 Swipedia
      </span>

      <a
        href="https://likabletester-arch.github.io/swipedia-privacy/"
        data-i18n="privacyPolicy">
      </a>

    </div>

  </footer>


  <script>

    const translations = {

      tr: {

        pageTitle:
          "Hesap Silme Talebi | Swipedia",

        metaDescription:
          "Swipedia hesabınızın ve hesabınızla ilişkili verilerin silinmesini talep edin.",

        badge:
          "HESAP VE VERİ YÖNETİMİ",

        heroTitle:
          "Swipedia hesabınızı silmek mi istiyorsunuz?",

        heroDescription:
          "Swipedia kullanıcıları hesaplarının ve hesaplarıyla ilişkili kişisel verilerin silinmesini talep edebilir. Aşağıdaki adımları izleyerek hesap silme talebinizi bize iletebilirsiniz.",


        requestTitle:
          "Hesap silme talebi nasıl gönderilir?",

        requestDescription:
          "Hesabınızın size ait olduğunu doğrulayabilmemiz için talebinizi mümkünse Swipedia hesabınızda kullandığınız e-posta adresinden göndermenizi rica ederiz.",


        step1:
          'Swipedia hesabınızda kullandığınız <strong>e-posta adresinden</strong> bize e-posta gönderin.',

        step2:
          'E-postanın konu kısmına <strong>“Swipedia Hesap Silme Talebi”</strong> yazın.',

        step3:
          'Mesajınızda Swipedia <strong>kullanıcı adınızı</strong> belirtin.',

        step4:
          "Hesap sahipliği doğrulandıktan sonra hesabınız ve silinmesi gereken ilişkili veriler silme sürecine alınacaktır.",


        requestButton:
          "Hesap Silme Talebi Gönder",


        warning:
          "<strong>Önemli:</strong> Güvenliğiniz için e-posta içerisinde Swipedia şifrenizi veya başka bir hesabınıza ait şifreleri kesinlikle göndermeyin.",


        dataTitle:
          "Hangi veriler silinebilir?",

        dataDescription:
          "Hesap silme işlemi kapsamında hesabınızla ilişkilendirilen veriler, geçerli yasal veya güvenlik amaçlı saklama yükümlülükleri bulunmadığı ölçüde silinebilir.",

        data1:
          "Hesap ve profil bilgileri",

        data2:
          "Kullanıcı hesabı tanımlayıcıları",

        data3:
          "Kullanıcı tarafından oluşturulan içerikler",

        data4:
          "Hesapla ilişkilendirilen diğer kullanıcı verileri",


        contactTitle:
          "İletişim",

        contactDescription:
          "Hesap veya veri silme işlemi hakkında sorularınız için bizimle iletişime geçebilirsiniz:",

        developer:
          "Geliştirici: Mustafa Keskin",

        privacyPolicy:
          "Gizlilik Politikası",

        emailSubject:
          "Swipedia Hesap Silme Talebi"
      },


      en: {

        pageTitle:
          "Account Deletion Request | Swipedia",

        metaDescription:
          "Request the deletion of your Swipedia account and the data associated with your account.",

        badge:
          "ACCOUNT & DATA MANAGEMENT",

        heroTitle:
          "Want to delete your Swipedia account?",

        heroDescription:
          "Swipedia users may request the deletion of their accounts and personal data associated with those accounts. Follow the steps below to submit an account deletion request.",


        requestTitle:
          "How do I submit an account deletion request?",

        requestDescription:
          "To help us verify that the account belongs to you, please send your request from the email address associated with your Swipedia account whenever possible.",


        step1:
          'Send us an email from the <strong>email address associated with your Swipedia account</strong>.',

        step2:
          'Use <strong>“Swipedia Account Deletion Request”</strong> as the subject of your email.',

        step3:
          'Include your Swipedia <strong>username</strong> in your message.',

        step4:
          "After account ownership has been verified, your account and associated data that is eligible for deletion will be processed for deletion.",


        requestButton:
          "Send Account Deletion Request",


        warning:
          "<strong>Important:</strong> For your security, never include your Swipedia password or passwords for any other account in your email.",


        dataTitle:
          "What data may be deleted?",

        dataDescription:
          "As part of the account deletion process, data associated with your account may be deleted unless it must be retained for applicable legal, security, or other legitimate requirements.",

        data1:
          "Account and profile information",

        data2:
          "User account identifiers",

        data3:
          "User-generated content",

        data4:
          "Other user data associated with the account",


        contactTitle:
          "Contact",

        contactDescription:
          "If you have questions about account or data deletion, you may contact us at:",

        developer:
          "Developer: Mustafa Keskin",

        privacyPolicy:
          "Privacy Policy",

        emailSubject:
          "Swipedia Account Deletion Request"
      }
    };


    function setLanguage(language) {

      if (!translations[language]) {
        language = "en";
      }

      const t =
        translations[language];


      document.documentElement.lang =
        language;


      document.title =
        t.pageTitle;


      const metaDescription =
        document.getElementById(
          "metaDescription"
        );

      if (metaDescription) {

        metaDescription.setAttribute(
          "content",
          t.metaDescription
        );

      }


      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

          const key =
            element.getAttribute(
              "data-i18n"
            );

          if (t[key] !== undefined) {

            element.textContent =
              t[key];

          }

        });


      document
        .querySelectorAll(
          "[data-i18n-html]"
        )
        .forEach(element => {

          const key =
            element.getAttribute(
              "data-i18n-html"
            );

          if (t[key] !== undefined) {

            element.innerHTML =
              t[key];

          }

        });


      document
        .querySelectorAll(
          ".lang-button"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.lang === language
          );

        });


      const emailButton =
        document.getElementById(
          "deletionEmailButton"
        );


      if (emailButton) {

        emailButton.href =
          "mailto:likabletester@gmail.com?subject=" +
          encodeURIComponent(
            t.emailSubject
          );

      }


      localStorage.setItem(
        "swipedia-language",
        language
      );

    }


    function getInitialLanguage() {

      const savedLanguage =
        localStorage.getItem(
          "swipedia-language"
        );


      if (
        savedLanguage === "tr" ||
        savedLanguage === "en"
      ) {

        return savedLanguage;

      }


      const browserLanguage =
        navigator.language ||
        navigator.userLanguage ||
        "en";


      if (
        browserLanguage
          .toLowerCase()
          .startsWith("tr")
      ) {

        return "tr";

      }


      return "en";

    }


    setLanguage(
      getInitialLanguage()
    );

  </script>

</body>
</html>
