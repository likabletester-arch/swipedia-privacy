  <style>
    :root {
      --bg: #100d0c;
      --bg-soft: #171210;
      --card: rgba(37, 28, 24, 0.72);
      --card-hover: rgba(46, 34, 29, 0.88);
      --border: rgba(255, 112, 82, 0.14);

      --primary: #ff684f;
      --primary-light: #ff826d;
      --primary-dark: #d94d37;

      --text: #f7f3f1;
      --text-soft: #b8aaa4;
      --text-muted: #857771;

      --max-width: 920px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);
      line-height: 1.75;

      background:
        radial-gradient(
          circle at 85% -10%,
          rgba(255, 104, 79, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at -10% 35%,
          rgba(110, 56, 35, 0.15),
          transparent 25%
        ),
        var(--bg);
    }

    .background-shape {
      position: fixed;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: rgba(106, 55, 38, 0.10);
      filter: blur(2px);
      z-index: -1;
      pointer-events: none;
    }

    .shape-one {
      top: -260px;
      right: -160px;
    }

    .shape-two {
      bottom: -330px;
      left: -250px;
      width: 600px;
      height: 600px;
      background: rgba(255, 104, 79, 0.04);
    }

    nav {
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(16, 13, 12, 0.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: auto;
      min-height: 76px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #ff755d,
          #ff5742
        );

      box-shadow:
        0 10px 30px rgba(255, 104, 79, 0.18);
    }

    .sparkles {
      position: relative;
      width: 25px;
      height: 25px;
    }

    .sparkle {
      position: absolute;
      color: white;
      line-height: 1;
    }

    .sparkle.big {
      font-size: 23px;
      left: 4px;
      top: 3px;
    }

    .sparkle.small-one {
      font-size: 11px;
      top: -1px;
      left: 0;
    }

    .sparkle.small-two {
      font-size: 9px;
      right: 0;
      top: 2px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.7px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-label {
      color: var(--text-muted);
      font-size: 14px;
    }

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 4px;

      padding: 4px;

      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 11px;
    }

    .lang-button {
      border: 0;
      background: transparent;
      color: var(--text-muted);

      padding: 7px 10px;
      border-radius: 8px;

      cursor: pointer;

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      transition: 0.2s ease;
    }

    .lang-button:hover {
      color: white;
    }

    .lang-button.active {
      background: var(--primary);
      color: white;
    }

    main {
      max-width: var(--max-width);
      margin: auto;
      padding: 80px 24px 90px;
    }

    .hero {
      padding: 30px 0 65px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;
      border-radius: 999px;

      color: var(--primary-light);
      background: rgba(255, 104, 79, 0.08);
      border: 1px solid rgba(255, 104, 79, 0.16);

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;

      margin-bottom: 24px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 12px rgba(255, 104, 79, 0.8);
    }

    h1 {
      max-width: 700px;
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.04;
      letter-spacing: -3px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    h1 span {
      color: var(--primary);
    }

    .hero-description {
      max-width: 650px;
      color: var(--text-soft);
      font-size: 18px;
      line-height: 1.8;
    }

    .updated {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .updated-icon {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
    }

    .intro-card {
      position: relative;
      overflow: hidden;

      padding: 30px;
      margin-bottom: 48px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 104, 79, 0.08),
          rgba(35, 27, 23, 0.75)

      border: 1px solid rgba(255, 104, 79, 0.16);
      border-radius: 24px;
    }

    .intro-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      right: -90px;
      top: -100px;
      background: rgba(255, 104, 79, 0.07);
    }

    .intro-card p {
      position: relative;
      z-index: 2;
      color: #d6cbc6;
      font-size: 16px;
    }

    .intro-card strong {
      color: white;
    }

    .policy-section {

      padding: 32px;

      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 22px;

      backdrop-filter: blur(12px);

      transition:

        border-color 0.25s ease,

    }

      border-color: rgba(255, 104, 79, 0.18);
      background: var(--card-hover);
    }

      gap: 17px;

      font-weight: 800;

      padding-left: 24px;
      margin: 10px 0;
      color: var(--text-soft);

      content: "";

      left: 2px;
      top: 12px;

      height: 7px;
      border-radius: 50%;

      background: var(--primary);
      box-shadow: 0 0 8px rgba(255, 104, 79, 0.25);

      align-items: center;

      padding: 11px 16px;

      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;

      border-radius: 12px;
      background: rgba(255, 104, 79, 0.12);
      border: 1px solid rgba(255, 104, 79, 0.22);

      transition: 0.2s ease;
    }

    .deletion-link:hover {
      background: var(--primary);
      transform: translateY(-1px);
    }

    .contact-card {
      margin-top: 45px;
      padding: 38px;

      border-radius: 25px;

      background:

      border: 1px solid rgba(255, 104, 79, 0.20);
    }

    .contact-label {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 10px;
    }

    .contact-card h2 {
      font-size: 30px;
      margin-bottom: 12px;
      padding: 0;
    }

    .contact-card p {
      color: var(--text-soft);
      margin-bottom: 23px;
    }

    .email-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 13px 18px;

      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;

      border-radius: 13px;
      background: var(--primary);

      box-shadow:

      transition:

    }

    .email-button:hover {
      transform: translateY(-2px);
      background: var(--primary-light);
    }

    footer {

    }

    .footer-inner {
      max-width: var(--max-width);
      margin: auto;
      padding: 34px 24px 50px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;

      color: var(--text-muted);
      font-size: 13px;
    }

    .footer-brand {
      color: #d8cfcb;
      font-weight: 700;
    }

    @media (max-width: 650px) {
      .nav-inner {
        min-height: 67px;
        padding: 0 18px;

        height: 38px;
        border-radius: 11px;
      }

      .brand-name {
        font-size: 19px;
      }

      .nav-label {

      }

      .nav-right {

      main {

      .hero {
        padding-bottom: 45px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .hero-description {

      }

      .intro-card {

        border-radius: 19px;
      }

      .policy-section {
        padding: 23px 20px;
        border-radius: 18px;
      }

      .section-heading {
        gap: 13px;
      }

      .number {
        width: 37px;
        height: 37px;
        border-radius: 11px;
      }

      h2 {
        font-size: 19px;
        padding-top: 4px;
      }

      .contact-card {
        padding: 27px 22px;
      }

      .contact-card h2 {
        font-size: 25px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

    function setLanguage(language) {

      if (!translations[language]) {
        language = "en";
      }

      const t = translations[language];

      document.documentElement.lang = language;

      document.title = t.pageTitle;

      const metaDescription =
        document.getElementById("metaDescription");

      if (metaDescription) {
        metaDescription.setAttribute(
          "content",
          t.metaDescription
        );
      }


      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

          const key =
            element.getAttribute("data-i18n");

          if (t[key] !== undefined) {
            element.textContent = t[key];
          }

        });


      document
        .querySelectorAll("[data-i18n-html]")
        .forEach(element => {

          const key =
            element.getAttribute("data-i18n-html");

          if (t[key] !== undefined) {
            element.innerHTML = t[key];
          }

        });


      document
        .querySelectorAll(".lang-button")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.lang === language
          );

        });


      localStorage.setItem(
        "swipedia-language",
        language
      );
    }


    function getInitialLanguage() {

      const savedLanguage =
        localStorage.getItem(
          "swipedia-language"
        );

      if (
        savedLanguage === "tr" ||
        savedLanguage === "en"
      ) {
        return savedLanguage;
      }


      const browserLanguage =
        navigator.language ||
        navigator.userLanguage ||
        "en";


      if (
        browserLanguage
          .toLowerCase()
          .startsWith("tr")
      ) {
        return "tr";
      }

      return "en";
    }


    setLanguage(
      getInitialLanguage()
    );
  </script>
